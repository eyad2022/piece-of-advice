<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advice Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1 class="advice-id">ADVICE #<span id="adviceId">117</span></h1>
        
        <p class="advice-text" id="adviceText">"It is easy to sit up and take notice, what's difficult is getting up and taking action."</p>

        <div class="divider">
            <div class="line"></div>
            <div class="pause-icon">||</div>
            <div class="line"></div>
        </div>

        <button class="dice-btn" id="generateBtn" aria-label="Generate new advice">
            <svg  width="30" height="30" xmlns="http://www.w3.org/2000/svg"><path d="M20 0H4a4.005 4.005 0 0 0-4 4v16a4.005 4.005 0 0 0 4 4h16a4.005 4.005 0 0 0 4-4V4a4.005 4.005 0 0 0-4-4ZM7.5 18a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm0-9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm4.5 4.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm4.5 4.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm0-9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z" fill="#202733"/></svg>
        </button>
    </main>

    <script src="script.js"></script>
</body>
</html>
